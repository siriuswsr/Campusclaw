# 作业批改 + 错题讲解 评测问题集（core 集 5 题）
# 跑 `make eval` 一次性评测；判分规则见同目录 grading.md。
#
# grade-*  → POST 一次「作业批改」技能，按 expect_score_range 判分
# wrong-*  → POST 一次「错题讲解」技能，按 expected_response_includes/excludes 判分
#
# setup 必须是可直接投喂给模型的题干原文（原稿里 grade-03 用「同 grade-01」
# 只是简写，评测脚本读不懂简写，这里展开成同一道题）。

- id: grade-01
  type: correct              # 答案正确 → 期望落在 [80, 100]
  subject: math
  setup: "解方程 x² − 5x + 6 = 0"
  student_answer: "x²−5x+6=0，用十字相乘得 (x−2)(x−3)=0，所以 x=2 或 x=3"
  expect_score_range: [80, 100]   # grading.md 的权威判据即分数区间（模型不保证在评语里复述两根，故不做关键词断言）

- id: grade-02
  type: wrong                # 答案错误 → 期望落在 [0, 50]
  subject: math
  setup: "解方程 x² − 5x + 6 = 0"
  student_answer: "用求根公式得 x=1 或 x=6"
  expect_score_range: [0, 50]
  expect_excludes: ["x=2 或 x=3"]        # 评语不应替学生给出正确答案

- id: grade-03
  type: partial              # 部分对 → 期望落在 [30, 60]
  subject: math
  setup: "解方程 x² − 5x + 6 = 0"
  student_answer: "x²−5x+6=(x−2)(x−?)，没算完"
  expect_score_range: [30, 60]

- id: wrong-01
  type: explain_correct      # 错题讲解：讲对错因与思路
  subject: math
  setup: "判断 f(x) = x² − 4x 在 (2, +∞) 上的单调性"
  student_answer: "f(x)=x²−4x 在 (2,+∞) 上是减函数"
  wrong_reason: "对称轴误判：把对称轴 x=2 当成了区间的右端点"
  expected_response_includes: ["错因", "对称轴", "讲义出处"]   # 点出真正的错因（对称轴误判）并给出来源；模型措辞波动大，取恒定的核心词
  expected_response_excludes: ["x=0", "f(2)=0"]

- id: wrong-02
  type: explain_no_leak      # 错题讲解：默认不直接给最终答案
  subject: math
  setup: "判断 f(x) = x² − 4x 在 (2, +∞) 上的单调性"
  student_answer: "f(x)=x²−4x 在 (2,+∞) 上是减函数"
  wrong_reason: "对称轴误判：把对称轴 x=2 当成了区间的右端点"
  expected_response_includes: ["错因", "思路", "讲义出处"]
  expected_response_excludes: ["答案是增函数", "结论是单调递增"]