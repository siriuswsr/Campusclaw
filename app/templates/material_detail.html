{% extends "base.html" %}
{% block title %}CampusClaw — 材料详情{% endblock %}

{% block styles %}
<style>
  .meta { font-size: 13px; color: #666; margin-bottom: 16px; }
  .meta span { margin-right: 18px; }
  pre.body { margin: 0; padding: 14px; background: #fafafa; border: 1px solid #eee; border-radius: 6px;
             font-size: 13px; line-height: 1.6; white-space: pre-wrap; word-break: break-word;
             max-height: 460px; overflow: auto; font-family: inherit; color: #333; }
</style>
{% endblock %}

{% block content %}
<h1 class="page-title">材料详情</h1>

<section class="card" id="detail-section">
  <div class="empty" id="loading">加载中…</div>
</section>
<section class="card" id="body-section" style="display:none;">
  <h2>材料正文</h2>
  <pre class="body" id="body-text"></pre>
</section>
{% endblock %}

{% block scripts %}
<script>
/* Detail page shell: the id is fetched with the Bearer token, so cross-class and
   nonexistent materials surface as the SAME 404 → identical 「材料不存在或无权访问」. */
(function () {
  if (!CCAuth.guard()) return;

  var MID = {{ mid }};
  var LIST_PAGE = "{{ url_for('materials.list_page') }}";                  // 学生：讲义与检索
  var TEACHER_LIST_PAGE = "{{ url_for('pages.teacher_materials') }}";      // 教师：讲义管理
  var GET_TPL = "{{ url_for('materials.get_api', mid=0) }}";            // /materials/api/0
  var DL_TPL = "{{ url_for('materials.download_api', mid=0) }}";        // /materials/api/0/download
  var user = CCAuth.user() || {};

  function $(id) { return document.getElementById(id); }

  function backPage() {
    return user.role === 'teacher' ? TEACHER_LIST_PAGE : LIST_PAGE;
  }

  function fmtDate(v) {
    if (!v) return '';
    var d = new Date(v);
    if (isNaN(d.getTime())) return String(v);
    function p(n) { return (n < 10 ? '0' : '') + n; }
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' '
         + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
  }

  function notFound() {
    var box = $('detail-section');
    box.textContent = '';
    var d = document.createElement('div');
    d.className = 'empty';
    d.textContent = '材料不存在或无权访问';
    box.appendChild(d);
    var p = document.createElement('p');
    p.style.textAlign = 'center';
    p.style.margin = '6px 0 0';
    var a = document.createElement('a');
    a.href = backPage();
    a.textContent = '返回材料列表';
    p.appendChild(a);
    box.appendChild(p);
  }

  function render(item) {
    var box = $('detail-section');
    box.textContent = '';

    var h = document.createElement('h2');
    h.textContent = item.title;
    box.appendChild(h);

    var meta = document.createElement('div');
    meta.className = 'meta';
    [['上传者：', item.uploader_name || ''], ['上传时间：', fmtDate(item.created_at)]]
      .forEach(function (pair) {
        var s = document.createElement('span');
        s.textContent = pair[0] + pair[1];
        meta.appendChild(s);
      });
    box.appendChild(meta);

    // 下载必须带 Bearer 头，所以走 authFetch 取 blob 而不是普通链接
    var btn = document.createElement('button');
    btn.className = 'btn';
    btn.type = 'button';
    btn.textContent = '下载 / 打开原文件';
    btn.addEventListener('click', function () {
      CCAuth.download(DL_TPL.replace(/\/0\/download$/, '/' + MID + '/download'),
                      item.title || '')
        .catch(function (e) {
          if (String(e && e.message) === 'unauthorized') return;
          alert('下载失败，请稍后重试');
        });
    });
    box.appendChild(btn);

    if (item.body_text) {
      $('body-text').textContent = item.body_text;
      $('body-section').style.display = '';
    }
  }

  CCAuth.authFetch(GET_TPL.replace(/\/0$/, '/' + MID))
    .then(function (r) {
      if (r.status === 404) { notFound(); return null; }
      if (r.status !== 200) throw new Error('load failed: ' + r.status);
      return r.json();
    })
    .then(function (item) { if (item) render(item); })
    .catch(function (e) {
      if (String(e && e.message) === 'unauthorized') return;
      $('loading').textContent = '材料加载失败，请稍后重试';
    });
})();
</script>
{% endblock %}
