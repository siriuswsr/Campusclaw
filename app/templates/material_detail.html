<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>CampusClaw — 材料详情</title>
<style>
  :root { --pkured: #94070A; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", "PingFang SC", sans-serif; background: #f5f5f7; }
  header { background: #fff; border-bottom: 1px solid #e5e5e5; padding: 14px 24px;
           display: flex; justify-content: space-between; align-items: center; }
  header h1 { margin: 0; font-size: 18px; color: var(--pkured); }
  main { max-width: 960px; margin: 24px auto; padding: 0 24px; }
  section { background: #fff; border-radius: 10px; padding: 20px; margin-bottom: 20px;
            box-shadow: 0 1px 6px rgba(0,0,0,.06); }
  h2 { margin: 0 0 14px; font-size: 15px; border-bottom: 2px solid var(--pkured); padding-bottom: 6px; }
  .meta { font-size: 13px; color: #666; margin-bottom: 16px; }
  .meta span { margin-right: 18px; }
  a { color: var(--pkured); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .btn { display: inline-block; padding: 9px 20px; background: var(--pkured); color: #fff;
         border-radius: 4px; font-size: 14px; }
  .btn:hover { text-decoration: none; background: #7b0508; }
  .empty { color: #999; padding: 28px; text-align: center; font-size: 15px; }
  pre.body { margin: 0; padding: 14px; background: #fafafa; border: 1px solid #eee; border-radius: 6px;
             font-size: 13px; line-height: 1.6; white-space: pre-wrap; word-break: break-word;
             max-height: 460px; overflow: auto; font-family: inherit; color: #333; }
</style>
</head>
<body>
<header>
  <h1>CampusClaw · 材料详情</h1>
  <div style="font-size:13px;color:#666;">
    {{ user.username }}
    &nbsp;|&nbsp;<a href="{{ url_for('materials.list_page') }}">返回列表</a>
    &nbsp;|&nbsp;<a href="{{ url_for('auth.logout') }}">退出登录</a>
  </div>
</header>

<main>
  <section>
  {% if item %}
    <h2>{{ item.title }}</h2>
    <div class="meta">
      <span>上传者：{{ item.uploader_name }}</span>
      <span>上传时间：{{ item.created_at.strftime('%Y-%m-%d %H:%M:%S') if item.created_at else '' }}</span>
    </div>
    <a class="btn" href="{{ url_for('materials.download_api', mid=item.id) }}">下载 / 打开原文件</a>
  {% else %}
    <div class="empty">材料不存在或无权访问</div>
    <p style="text-align:center;margin:6px 0 0;">
      <a href="{{ url_for('materials.list_page') }}">返回材料列表</a>
    </p>
  {% endif %}
  </section>

  {% if body %}
  <section>
    <h2>材料正文</h2>
    <pre class="body">{{ body }}</pre>
  </section>
  {% endif %}
</main>
</body>
</html>
