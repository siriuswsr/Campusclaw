{% extends "base.html" %}
{% block title %}CampusClaw — 讲义与检索{% endblock %}

{% block styles %}
<style>
  /* ---- 检索 / 问答 tab ---- */
  .tabs { display: flex; gap: 8px; margin-bottom: 14px; }
  .tab { padding: 7px 18px; border: 1px solid #d0d0d0; background: #fafafa; border-radius: 6px;
         cursor: pointer; font-size: 14px; color: #444; }
  .tab.active { background: var(--pkured); color: #fff; border-color: var(--pkured); }
  .srch-row { display: flex; gap: 8px; }
  .srch-row input[type=text] { flex: 1; padding: 8px; border: 1px solid #d0d0d0; border-radius: 4px; font-size: 14px; }
  .srch-row select { padding: 8px; border: 1px solid #d0d0d0; border-radius: 4px; font-size: 14px; background: #fff; }
  .srch-row button { padding: 9px 20px; background: var(--pkured); color: #fff; border: none;
                     border-radius: 4px; cursor: pointer; font-size: 14px; white-space: nowrap; }
  .srch-row button:disabled { opacity: .6; cursor: default; }
  #search-msg, #qa-msg { margin-top: 12px; }
  .hit { border: 1px solid #eee; border-left: 3px solid var(--pkured); border-radius: 6px;
         padding: 12px 14px; margin-top: 10px; }
  .hit-title { font-size: 14px; font-weight: 600; }
  .hit-meta { font-size: 12px; color: #888; margin: 4px 0 8px; }
  .hit-excerpt { font-size: 13px; color: #333; white-space: pre-wrap; line-height: 1.55; }
  .answer { font-size: 14px; line-height: 1.65; color: #222; white-space: pre-wrap;
            background: #fcf7f7; border: 1px solid #efe1e1; border-radius: 6px; padding: 12px 14px; }
  .cites { margin-top: 12px; }
  .cites h3 { font-size: 13px; color: #666; margin: 0 0 8px; }
  .cite { font-size: 13px; padding: 8px 0; border-bottom: 1px dashed #eee; }
  .cite .no { display: inline-block; min-width: 22px; color: var(--pkured); font-weight: 600; }
  .cite .cm { color: #999; font-size: 12px; margin-left: 6px; }

  /* ---- 学科过滤 chips ---- */
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .chips .chip { padding: 5px 14px; border: 1px solid #d0d0d0; background: #fafafa;
                 border-radius: 16px; font-size: 13px; color: #444; cursor: pointer; }
  .chips .chip.active { background: var(--pkured); color: #fff; border-color: var(--pkured); }

  /* ---- 本班材料列表 ---- */
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; padding: 10px; background: #fafafa; color: var(--pkured); border-bottom: 2px solid var(--pkured); }
  td { padding: 10px; border-bottom: 1px solid #eee; }
  td a { color: var(--pkured); text-decoration: none; }
  td a:hover { text-decoration: underline; }
</style>
{% endblock %}

{% block content %}
<h1 class="page-title">讲义与检索</h1>
<p class="page-sub">在本班知识库中检索，结果会标注来源（讲义名与位置）。</p>

<div class="msg ok" id="teacher-tip" style="display:none;">
  上传与索引管理请前往左侧「讲义管理」。
</div>

<section class="card" id="kb">
  <h2>知识库检索</h2>
  <div class="tabs">
    <button type="button" class="tab active" data-tab="search">检索</button>
    <button type="button" class="tab" data-tab="qa">问答</button>
  </div>

  <div id="panel-search">
    <div class="srch-row">
      <input type="text" id="search-q" placeholder="输入查询内容，例如：分数的通分">
      <select id="search-mode" title="检索模式">
        <option value="hybrid" selected>hybrid</option>
        <option value="keyword">keyword</option>
        <option value="vector">vector</option>
      </select>
      <button type="button" id="search-btn">检 索</button>
    </div>
    <div id="search-msg" class="msg err" style="display:none;"></div>
    <div id="search-results"></div>
  </div>

  <div id="panel-qa" style="display:none;">
    <div class="srch-row">
      <input type="text" id="qa-q" placeholder="就本班材料提问，例如：异分母分数相加之前要做什么">
      <button type="button" id="qa-btn">提 问</button>
    </div>
    <div id="qa-msg" class="msg err" style="display:none;"></div>
    <div id="qa-answer"></div>
    <div id="qa-cites" class="cites"></div>
  </div>
</section>

<section class="card">
  <h2>本班材料列表</h2>
  <!-- 学科过滤条：点「全部」清掉 subject，点某个学科则请求带 ?subject=学科 -->
  <div class="chips" id="subject-chips"></div>
  <div id="list-msg" class="msg err" style="display:none;"></div>
  <table id="mtable" style="display:none;">
    <thead><tr><th>标题</th><th>学科</th><th>上传者</th><th>上传时间</th><th>操作</th></tr></thead>
    <tbody id="mtbody"></tbody>
  </table>
  <div class="empty" id="mempty" style="display:none;">暂无材料</div>
</section>
{% endblock %}

{% block scripts %}
<script>
  // 教师落在本页（登录页写死了这个落地页）时，指路到讲义管理
  if (window.CCAuth && CCAuth.guard() && (CCAuth.user() || {}).role === 'teacher') {
    document.getElementById('teacher-tip').style.display = 'block';
  }
</script>
<script>
/* 列表/下载与学生页、教师页共用（app/static/materials.js）；
   这里只注入差异：学生页没有上传表单，也不提供「重新索引」。 */
window.CC_MATERIALS_CFG = {
  listApi:     "{{ url_for('materials.list_api') }}",
  detailTpl:   "{{ url_for('materials.detail_page', mid=0) }}",
  downloadTpl: "{{ url_for('materials.download_api', mid=0) }}",
  canUpload:   false,
  canReindex:  false,
  filterSubjects: {{ SUBJECT_CHOICES | tojson }}
};
</script>
<script src="{{ url_for('static', filename='materials.js') }}"></script>
<script>
/* 知识库检索区 —— 仅做界面与请求编排；
   过滤/排序/相似度/班级判定/降级全部由服务端负责，前端不携带任何班级或密钥参数。 */
(function () {
  if (!CCAuth.guard()) return;
  var SEARCH_URL = "{{ url_for('search.search_api') }}";   // GET /api/search
  var ASK_URL = "{{ url_for('qa.ask_api') }}";             // POST /api/ask
  var OPEN_TPL = "{{ url_for('materials.download_api', mid=0) }}"; // /materials/api/0/download

  function openUrl(mid) {
    return OPEN_TPL.replace(/\/0\/download$/, '/' + mid + '/download');
  }

  function $(id) { return document.getElementById(id); }

  function showMsg(el, text) {
    if (!text) { el.style.display = 'none'; el.textContent = ''; return; }
    el.textContent = text;
    el.style.display = 'block';
  }

  function busy(btn, on, label) {
    btn.disabled = on;
    btn.textContent = on ? label : btn.dataset.label;
  }

  // 打开材料：下载要走 Bearer 头，普通 <a href> 会拿不到 token
  function openMaterial(mid, title) {
    CCAuth.download(openUrl(mid), title || '')
      .catch(function (e) {
        if (String(e && e.message) === 'unauthorized') return;
        alert('打开材料失败，请稍后重试');
      });
  }

  // ---- tabs ----
  var tabs = document.querySelectorAll('#kb .tab');
  Array.prototype.forEach.call(tabs, function (btn) {
    btn.addEventListener('click', function () {
      Array.prototype.forEach.call(tabs, function (b) { b.classList.remove('active'); });
      btn.classList.add('active');
      var isSearch = btn.getAttribute('data-tab') === 'search';
      $('panel-search').style.display = isSearch ? '' : 'none';
      $('panel-qa').style.display = isSearch ? 'none' : '';
    });
  });

  // ---- 检索 tab ----
  function renderHits(hits) {
    var box = $('search-results');
    box.textContent = '';
    if (!hits.length) {
      var e = document.createElement('div');
      e.className = 'empty';
      e.textContent = '未找到相关材料';
      box.appendChild(e);
      return;
    }
    hits.forEach(function (h) {
      var card = document.createElement('div');
      card.className = 'hit';

      var title = document.createElement('a');
      title.className = 'hit-title';
      title.href = '#';
      title.textContent = h.material_title;
      title.addEventListener('click', function (ev) {
        ev.preventDefault();
        openMaterial(h.material_id, h.material_title);
      });

      var meta = document.createElement('div');
      meta.className = 'hit-meta';
      meta.textContent = '切片 #' + h.chunk_index + ' · 字符区间 [' + h.char_start + ', ' + h.char_end + ')';

      var ex = document.createElement('div');
      ex.className = 'hit-excerpt';
      ex.textContent = h.excerpt;

      card.appendChild(title);
      card.appendChild(meta);
      card.appendChild(ex);
      box.appendChild(card);
    });
  }

  function doSearch() {
    var q = $('search-q').value.trim();
    var mode = $('search-mode').value;
    var msg = $('search-msg');
    if (!q) { showMsg(msg, '请输入查询内容'); $('search-results').textContent = ''; return; }
    showMsg(msg, '');
    var btn = $('search-btn');
    busy(btn, true, '检索中…');

    CCAuth.authFetch(SEARCH_URL + '?q=' + encodeURIComponent(q) + '&mode=' + encodeURIComponent(mode))
      .then(function (r) {
        return r.json().catch(function () { return {}; })
          .then(function (d) { return { status: r.status, data: d }; });
      })
      .then(function (res) {
        busy(btn, false);
        if (res.status === 503) {
          showMsg(msg, mode === 'keyword' ? '服务暂不可用，请稍后重试' : '向量检索暂不可用，请改用关键字检索');
          $('search-results').textContent = '';
          return;
        }
        if (res.status === 400) { showMsg(msg, '请输入查询内容'); return; }
        if (res.status !== 200) { showMsg(msg, '检索失败，请稍后重试'); return; }
        renderHits((res.data && res.data.hits) || []);
      })
      .catch(function (e) {
        busy(btn, false);
        if (String(e && e.message) === 'unauthorized') return;
        showMsg(msg, '网络错误，检索失败');
      });
  }

  // ---- 问答 tab ----
  function renderAnswer(text) {
    var box = $('qa-answer');
    box.textContent = '';
    if (!text) return;
    var d = document.createElement('div');
    d.className = 'answer';
    d.textContent = text;
    box.appendChild(d);
  }

  function renderCites(cites) {
    var box = $('qa-cites');
    box.textContent = '';
    if (!cites.length) return;
    var h = document.createElement('h3');
    h.textContent = '出处（与回答中的 [n] 顺序一致）';
    box.appendChild(h);
    cites.forEach(function (c, i) {
      var row = document.createElement('div');
      row.className = 'cite';

      var no = document.createElement('span');
      no.className = 'no';
      no.textContent = '[' + (i + 1) + ']';

      var a = document.createElement('a');
      a.href = '#';
      a.textContent = c.material_title;
      a.addEventListener('click', function (ev) {
        ev.preventDefault();
        openMaterial(c.material_id, c.material_title);
      });

      var meta = document.createElement('span');
      meta.className = 'cm';
      meta.textContent = '切片 #' + c.chunk_index + ' · 字符区间 [' + c.char_start + ', ' + c.char_end + ')';

      row.appendChild(no);
      row.appendChild(a);
      row.appendChild(meta);
      box.appendChild(row);
    });
  }

  function doAsk() {
    var q = $('qa-q').value.trim();
    var msg = $('qa-msg');
    if (!q) { showMsg(msg, '请输入查询内容'); renderAnswer(''); renderCites([]); return; }
    showMsg(msg, '');
    var btn = $('qa-btn');
    busy(btn, true, '提问中…');

    CCAuth.authFetch(ASK_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: q })      // 后端规约字段为 message
    })
      .then(function (r) {
        return r.json().catch(function () { return {}; })
          .then(function (d) { return { status: r.status, data: d }; });
      })
      .then(function (res) {
        busy(btn, false);
        var d = res.data || {};
        if (res.status === 400) { showMsg(msg, '请输入查询内容'); return; }
        if (res.status === 503) {
          showMsg(msg, '向量检索暂不可用，请改用关键字检索');
          renderAnswer(d.answer || '资料中未找到相关内容');
          renderCites([]);
          return;
        }
        if (res.status !== 200) { showMsg(msg, '提问失败，请稍后重试'); return; }
        renderAnswer(d.answer || '资料中未找到相关内容');
        renderCites(d.citations || []);
      })
      .catch(function (e) {
        busy(btn, false);
        if (String(e && e.message) === 'unauthorized') return;
        showMsg(msg, '网络错误，提问失败');
      });
  }

  // ---- wire up ----
  var sb = $('search-btn'), qb = $('qa-btn');
  if (!sb || !qb) return;
  sb.dataset.label = sb.textContent;
  qb.dataset.label = qb.textContent;
  sb.addEventListener('click', doSearch);
  qb.addEventListener('click', doAsk);
  $('search-q').addEventListener('keydown', function (e) { if (e.key === 'Enter') doSearch(); });
  $('qa-q').addEventListener('keydown', function (e) { if (e.key === 'Enter') doAsk(); });
})();
</script>
{% endblock %}
